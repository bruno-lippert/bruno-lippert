name: Generate Snake

on:
  schedule:
    # executa a cada 12 horas (minuto 0)
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest

    # Esta parte é CRUCIAL para o erro de permissão (403):
    permissions:
      contents: write

    steps:
      # Gera a animação da cobrinha (Versão v3 Atualizada)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bruno-lippert
          outputs: dist/github-contribution-grid-snake.svg

      # Envia para a branch output
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
